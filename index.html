<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Vasudev's Interactive World</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {

    min-height:100vh;
    background:
    linear-gradient(135deg,#050816,#111827,#1e1b4b);

    color:white;
    overflow-x:hidden;
}


.app {

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}


.screen {

    display:none;
    width:100%;
    max-width:500px;
    padding:25px;
    text-align:center;

    animation:fade .5s ease;

}


.screen.active {

    display:block;

}


@keyframes fade {

from {
    opacity:0;
    transform:translateY(20px);
}

to {
    opacity:1;
    transform:translateY(0);
}

}



.card {

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border-radius:25px;

    padding:30px 20px;

    border:
    1px solid rgba(255,255,255,.15);

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);

}



h1 {

    font-size:2.2rem;
    margin-bottom:15px;

}


h2 {

    margin-bottom:20px;

}


p {

    color:#d1d5db;

    line-height:1.6;

    margin-bottom:20px;

}



.logo {

    font-size:70px;
    margin-bottom:15px;

}



.button {

    width:100%;

    padding:15px;

    margin:10px 0;

    border:none;

    border-radius:18px;

    color:white;

    font-size:1.1rem;

    cursor:pointer;

    transition:.2s;

}


.button:active {

    transform:scale(.96);

}



.snake-btn {

    background:
    linear-gradient(135deg,#22c55e,#16a34a);

}


.personality-btn {

    background:
    linear-gradient(135deg,#3b82f6,#2563eb);

}



.instagram-btn {

    background:
    linear-gradient(135deg,#ec4899,#8b5cf6);

}



.home-btn {

    background:
    linear-gradient(135deg,#374151,#111827);

}



.pause-btn {

    background:#92400e;

}



.small-text {

    color:#9ca3af;

    font-size:.85rem;

}



/* =====================
SNAKE
===================== */


#gameCanvas {

    width:100%;

    background:#020617;

    border-radius:20px;

    border:
    2px solid #22c55e;

}



.score {

    font-size:1.2rem;

    margin-bottom:15px;

}



.controls {

    display:grid;

    grid-template-columns:
    repeat(3,70px);

    justify-content:center;

    gap:8px;

    margin-top:20px;

}



.control-btn {

    height:60px;

    border:none;

    border-radius:15px;

    background:
    rgba(255,255,255,.15);

    color:white;

    font-size:25px;

}



.empty {

    visibility:hidden;

}



/* =====================
QUIZ
===================== */


.progress {

    height:8px;

    background:#374151;

    border-radius:10px;

    overflow:hidden;

    margin-bottom:20px;

}



.progress-bar {

    height:100%;

    width:0%;

    background:#3b82f6;

    transition:.3s;

}



.answer {

    background:
    rgba(255,255,255,.1);

    border:
    1px solid rgba(255,255,255,.2);

    padding:15px;

    border-radius:15px;

    margin:10px 0;

    cursor:pointer;

}



.answer:hover {

    background:
    rgba(255,255,255,.2);

}



/* GAME OVER */

.game-over-score {

    font-size:1.4rem;

    margin:20px;

}



@media(max-width:400px){

    h1 {
        font-size:1.8rem;
    }


    .controls {

        grid-template-columns:
        repeat(3,60px);

    }

}


</style>

</head>


<body>


<div class="app">


<!-- =====================
HOME
===================== -->


<section class="screen active" id="home">


<div class="card">


<div class="logo">🌍</div>


<h1>
Welcome to Vasudev’s World
</h1>


<p>

A small interactive place where you can
play a game, discover your personality,
and meet the person behind this.

</p>



<button class="button snake-btn"
onclick="showScreen('snake')">

🐍 Play Snake

</button>



<button class="button personality-btn"
onclick="startQuiz()">

🧠 Discover Your Personality

</button>



<button class="button instagram-btn"
onclick="openInstagram()">

👀 Who’s Behind This?

</button>



<p class="small-text">

Created with curiosity & creativity ✨

</p>


</div>


</section>





<!-- =====================
SNAKE
===================== -->


<section class="screen" id="snake">


<div class="card">


<h2>
🐍 Snake
</h2>



<div class="score">

Score:
<span id="score">0</span>

&nbsp;|&nbsp;

Best:
<span id="best">0</span>

</div>



<canvas id="gameCanvas"
width="350"
height="350">
</canvas>




<div class="controls">


<button class="control-btn empty"></button>


<button class="control-btn"
onclick="changeDirection('up')">
⬆️
</button>


<button class="control-btn empty"></button>



<button class="control-btn"
onclick="changeDirection('left')">
⬅️
</button>



<button class="control-btn"
onclick="changeDirection('down')">
⬇️
</button>



<button class="control-btn"
onclick="changeDirection('right')">
➡️
</button>


</div>




<button class="button pause-btn"
onclick="pauseGame()">

⏸ Pause

</button>



<button class="button home-btn"
onclick="showScreen('home')">

🏠 Back to Home

</button>



</div>


</section>





<!-- =====================
GAME OVER
===================== -->


<section class="screen" id="gameOver">


<div class="card">


<h1>
🐍 Game Over
</h1>


<div class="game-over-score">

Score:
<span id="finalScore">
0
</span>

<br>

Best:
<span id="finalBest">
0
</span>

</div>



<button class="button snake-btn"
onclick="showScreen('snake')">

🔄 Play Again

</button>



<button class="button home-btn"
onclick="showScreen('home')">

🏠 Back to Home

</button>



<button class="button instagram-btn"
onclick="openInstagram()">

👀 Who’s Behind This?

</button>



</div>


</section>





<!-- =====================
QUIZ
===================== -->


<section class="screen" id="quiz">


<div class="card">


<h2>
🧠 Personality Test
</h2>



<div class="progress">

<div class="progress-bar"
id="progress">

</div>

</div>



<div id="quizContent"></div>


</div>


</section>





<!-- =====================
RESULT
===================== -->


<section class="screen" id="result">


<div class="card">


<div id="resultContent"></div>



<button class="button home-btn"
onclick="showScreen('home')">

🏠 Back to Home

</button>



<button class="button instagram-btn"
onclick="openInstagram()">

👀 Who’s Behind This?

</button>



</div>


</section>


</div>



<script>

// ===============================
// NAVIGATION
// ===============================

function showScreen(id){

    document.querySelectorAll(".screen")
    .forEach(screen=>{
        screen.classList.remove("active");
    });

    document.getElementById(id)
    .classList.add("active");


    if(id==="snake"){
        resetGame();
    }

}



// ===============================
// INSTAGRAM
// ===============================

function openInstagram(){

    window.open(
        "https://www.instagram.com/vasudevrajan_",
        "_blank"
    );

}



// ===============================
// SNAKE GAME
// ===============================


const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");


let snake=[];
let food={};

let direction="right";
let nextDirection="right";

let score=0;

let best=
localStorage.getItem("snakeBest") || 0;


let gameLoop;

let speed=120;

let running=false;

let paused=false;



document.getElementById("best")
.innerText=best;



function resetGame(){

    snake=[

        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}

    ];


    direction="right";
    nextDirection="right";


    score=0;

    speed=120;

    paused=false;


    document.getElementById("score")
    .innerText=score;


    createFood();


    startGame();

}





function startGame(){

    clearInterval(gameLoop);


    running=true;


    gameLoop=
    setInterval(
        updateGame,
        speed
    );

}





function pauseGame(){

    if(!running) return;


    if(paused){

        paused=false;

        startGame();

    }

    else{

        paused=true;

        clearInterval(gameLoop);

    }

}





function updateGame(){


    if(paused)
    return;



    direction=nextDirection;


    let head={
        ...snake[0]
    };



    if(direction==="up")
        head.y--;


    if(direction==="down")
        head.y++;


    if(direction==="left")
        head.x--;


    if(direction==="right")
        head.x++;




    // wrap around

    if(head.x<0)
        head.x=34;


    if(head.x>34)
        head.x=0;


    if(head.y<0)
        head.y=34;


    if(head.y>34)
        head.y=0;





    // self collision

    if(
        snake.some(
            part=>
            part.x===head.x &&
            part.y===head.y
        )
    ){

        endGame();

        return;

    }




    snake.unshift(head);




    if(
        head.x===food.x &&
        head.y===food.y
    ){


        score++;


        document.getElementById("score")
        .innerText=score;


        checkAchievements(score);


        increaseDifficulty();


        createFood();


    }
    else{


        snake.pop();


    }



    drawGame();


}





function drawGame(){


    ctx.fillStyle="#020617";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    let size=10;



    // food

    ctx.fillStyle="#ef4444";


    ctx.beginPath();


    ctx.arc(

        food.x*size+5,

        food.y*size+5,

        5,

        0,

        Math.PI*2

    );


    ctx.fill();




    // snake

    snake.forEach((part,index)=>{


        ctx.fillStyle =
        index===0
        ? "#bbf7d0"
        : "#22c55e";


        ctx.fillRect(

            part.x*size,

            part.y*size,

            size,

            size

        );


    });



}





function createFood(){


    do{


        food={

            x:
            Math.floor(
                Math.random()*35
            ),


            y:
            Math.floor(
                Math.random()*35
            )

        };


    }

    while(

        snake.some(
            part=>
            part.x===food.x &&
            part.y===food.y
        )

    );


}





function increaseDifficulty(){


    if(
        score%5===0 &&
        speed>50
    ){


        speed-=10;


        clearInterval(gameLoop);


        gameLoop=
        setInterval(
            updateGame,
            speed
        );


    }

}





function endGame(){


    clearInterval(gameLoop);


    running=false;



    if(score>best){


        best=score;


        localStorage.setItem(
            "snakeBest",
            best
        );


    }



    document.getElementById("best")
    .innerText=best;



    document.getElementById("finalScore")
    .innerText=score;


    document.getElementById("finalBest")
    .innerText=best;



    showScreen("gameOver");


}





// ===============================
// CONTROLS
// ===============================


function changeDirection(dir){


    if(
        dir==="up" &&
        direction!=="down"
    )
        nextDirection="up";



    if(
        dir==="down" &&
        direction!=="up"
    )
        nextDirection="down";



    if(
        dir==="left" &&
        direction!=="right"
    )
        nextDirection="left";



    if(
        dir==="right" &&
        direction!=="left"
    )
        nextDirection="right";


}




document.addEventListener(
"keydown",
function(e){


    if(e.key==="ArrowUp" || e.key==="w")
        changeDirection("up");


    if(e.key==="ArrowDown" || e.key==="s")
        changeDirection("down");


    if(e.key==="ArrowLeft" || e.key==="a")
        changeDirection("left");


    if(e.key==="ArrowRight" || e.key==="d")
        changeDirection("right");


});






// Swipe support

let touchStartX=0;
let touchStartY=0;



canvas.addEventListener(
"touchstart",
function(e){


    touchStartX=
    e.changedTouches[0].screenX;


    touchStartY=
    e.changedTouches[0].screenY;


});




canvas.addEventListener(
"touchend",
function(e){


    let x=
    e.changedTouches[0].screenX;


    let y=
    e.changedTouches[0].screenY;



    let dx=x-touchStartX;

    let dy=y-touchStartY;



    if(
        Math.abs(dx)>
        Math.abs(dy)
    ){


        if(dx>0)
            changeDirection("right");

        else
            changeDirection("left");


    }

    else{


        if(dy>0)
            changeDirection("down");

        else
            changeDirection("up");


    }


});





// ===============================
// ACHIEVEMENTS
// ===============================


const achievements={


    first:{
        score:1,
        text:"🍎 First Bite"
    },


    ten:{
        score:10,
        text:"⭐ Growing Strong"
    },


    fifty:{
        score:50,
        text:"🔥 Snake Master"
    },


    hundred:{
        score:100,
        text:"🐍 Legendary Snake"
    }


};





function checkAchievements(score){


    let unlocked=
    JSON.parse(
        localStorage.getItem(
            "snakeAchievements"
        )
    ) || [];



    Object.keys(achievements)
    .forEach(key=>{


        let item=
        achievements[key];



        if(
            score>=item.score &&
            !unlocked.includes(key)
        ){


            unlocked.push(key);



            localStorage.setItem(

                "snakeAchievements",

                JSON.stringify(unlocked)

            );


            // small notification

            console.log(
                "Achievement unlocked:",
                item.text
            );


        }


    });


}



// draw initial empty board

drawGame();

// ===============================
// PERSONALITY TEST
// ===============================


const questions = [

{
q:"Your ideal weekend is:",
answers:[
["A","Trying something completely new","Explorer"],
["B","Reading, learning, or solving puzzles","Thinker"],
["C","Spending time with friends or family","Connector"],
["D","Organizing projects and getting things done","Organizer"]
]
},


{
q:"When facing a challenge, you usually:",
answers:[
["A","Jump in and experiment","Explorer"],
["B","Analyze the situation carefully","Thinker"],
["C","Ask others for ideas and support","Connector"],
["D","Create a step-by-step plan","Organizer"]
]
},


{
q:"People usually describe you as:",
answers:[
["A","Adventurous","Explorer"],
["B","Thoughtful","Thinker"],
["C","Caring","Connector"],
["D","Reliable","Organizer"]
]
},


{
q:"You enjoy activities that let you:",
answers:[
["A","Explore new experiences","Explorer"],
["B","Solve interesting problems","Thinker"],
["C","Help and connect with people","Connector"],
["D","Build and organize things","Organizer"]
]
},


{
q:"Your workspace is usually:",
answers:[
["A","Creative chaos","Explorer"],
["B","Full of notes and ideas","Thinker"],
["C","Comfortable and welcoming","Connector"],
["D","Clean and organized","Organizer"]
]
},


{
q:"In a group project you often:",
answers:[
["A","Suggest exciting ideas","Explorer"],
["B","Think about the details","Thinker"],
["C","Support everyone","Connector"],
["D","Keep things moving","Organizer"]
]
},


{
q:"When learning something new, you prefer:",
answers:[
["A","Trying it yourself","Explorer"],
["B","Understanding how it works","Thinker"],
["C","Learning with others","Connector"],
["D","Following a clear method","Organizer"]
]
},


{
q:"Which word fits you best?",
answers:[
["A","Curious","Explorer"],
["B","Wise","Thinker"],
["C","Kind","Connector"],
["D","Dependable","Organizer"]
]
}

];



let currentQuestion=0;


let results={

Explorer:0,

Thinker:0,

Connector:0,

Organizer:0

};





function startQuiz(){


    currentQuestion=0;


    results={

        Explorer:0,

        Thinker:0,

        Connector:0,

        Organizer:0

    };


    showScreen("quiz");


    displayQuestion();


}





function displayQuestion(){


    let question =
    questions[currentQuestion];


    let container =
    document.getElementById(
        "quizContent"
    );



    document.getElementById(
        "progress"
    ).style.width =

    (
        (currentQuestion /
        questions.length)
        *100

    )+"%";




    let html="";



    html +=

    `
    <h3>
    Question ${currentQuestion+1}
    / ${questions.length}
    </h3>
    `;



    html +=

    `
    <p>
    ${question.q}
    </p>
    `;



    question.answers.forEach(answer=>{


        html +=

        `
        <div class="answer"
        onclick="selectAnswer('${answer[2]}')">

        ${answer[0]}) ${answer[1]}

        </div>
        `;


    });



    container.innerHTML=html;


}





function selectAnswer(type){


    results[type]++;


    currentQuestion++;



    if(
        currentQuestion <
        questions.length
    ){

        displayQuestion();

    }

    else{

        showResult();

    }


}





function showResult(){



    let winner =

    Object.keys(results)
    .reduce(
        (a,b)=>
        results[a] >= results[b]
        ? a
        : b
    );




    const personalities={


    Explorer:{

        emoji:"🌟",

        title:"The Explorer",

        text:
        "You are curious, adventurous, and always looking for new experiences. You enjoy discovering ideas, places, and challenges."

    },


    Thinker:{

        emoji:"🧠",

        title:"The Thinker",

        text:
        "You love understanding how things work. You analyze situations, ask questions, and enjoy learning new concepts."

    },


    Connector:{

        emoji:"❤️",

        title:"The Connector",

        text:
        "You value people and relationships. Your energy comes from sharing moments and creating meaningful connections."

    },


    Organizer:{

        emoji:"🎯",

        title:"The Organizer",

        text:
        "You enjoy structure, planning, and turning ideas into reality. You are someone people can rely on."

    }


    };



    let result =
    personalities[winner];




    document.getElementById(
        "resultContent"
    ).innerHTML =



    `

    <h1>
    ${result.emoji}
    </h1>


    <h2>
    Your personality matches...
    <br><br>

    ${result.title}

    </h2>



    <p>

    ${result.text}

    </p>


    <button class="button personality-btn"

    onclick="startQuiz()">

    🔄 Retake Test

    </button>


    `;




    showScreen("result");


}





// ===============================
// FINAL INITIALIZATION
// ===============================


document.getElementById("best")
.innerText =
localStorage.getItem("snakeBest") || 0;



</script>


</body>

</html>
