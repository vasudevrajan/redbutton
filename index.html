<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Snake QR Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    color:white;
}

#gameContainer{
    text-align:center;
}

h1{
    margin-bottom:10px;
    color:#00ff99;
}

#score{
    font-size:24px;
    margin-bottom:15px;
}

canvas{
    background:#1d1d1d;
    border:4px solid #00ff99;
    border-radius:12px;
    touch-action:none;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#222;
    padding:25px;
    border-radius:15px;
    display:none;
    text-align:center;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#00ff99;
    color:#111;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#00dd88;
}

</style>
</head>

<body>

<div id="gameContainer">

<h1>🐍 Snake QR Game</h1>

<div id="score">
Score: <span id="scoreValue">0</span>
&nbsp;&nbsp;
High Score:
<span id="highScore">0</span>
</div>

<canvas
id="game"
width="400"
height="400">
</canvas>

</div>

<div id="gameOver">

<h2>Game Over!</h2>

<p>Your Score:
<span id="finalScore"></span>
</p>

<button onclick="restartGame()">
Play Again
</button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake;
let food;
let dx;
let dy;
let score;
let highScore = localStorage.getItem("snakeHighScore") || 0;
let gameSpeed;
let gameLoop;

document.getElementById("highScore").textContent = highScore;


function startGame(){

    snake = [
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    food = createFood();

    dx = 1;
    dy = 0;

    score = 0;

    gameSpeed = 120;

    document.getElementById("scoreValue").textContent = score;

    document.getElementById("gameOver").style.display="none";

    clearInterval(gameLoop);

    gameLoop = setInterval(update, gameSpeed);
}



function createFood(){

    let newFood;

    do{

        newFood = {
            x: Math.floor(Math.random()*tileCount),
            y: Math.floor(Math.random()*tileCount)
        };

    }while(
        snake.some(
            part => part.x === newFood.x && part.y === newFood.y
        )
    );

    return newFood;
}



function update(){

    let head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };


    // Wall collision

    if(
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
    ){
        endGame();
        return;
    }


    // Snake collision

    if(
        snake.some(
            part => part.x === head.x && part.y === head.y
        )
    ){
        endGame();
        return;
    }


    snake.unshift(head);


    // Eat food

    if(
        head.x === food.x &&
        head.y === food.y
    ){

        score++;

        document.getElementById("scoreValue").textContent = score;

        food = createFood();


        // Increase speed every 5 points

        if(score % 5 === 0 && gameSpeed > 50){

            gameSpeed -= 10;

            clearInterval(gameLoop);

            gameLoop = setInterval(update, gameSpeed);
        }

    }
    else{

        snake.pop();

    }


    draw();

}



function draw(){

    ctx.fillStyle="#1d1d1d";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Draw food

    ctx.fillStyle="red";

    ctx.beginPath();

    ctx.arc(
        food.x * gridSize + gridSize/2,
        food.y * gridSize + gridSize/2,
        gridSize/2 - 2,
        0,
        Math.PI*2
    );

    ctx.fill();



    // Draw snake

    snake.forEach((part,index)=>{

        ctx.fillStyle =
        index === 0 ? "#00ff99" : "#00cc77";

        ctx.fillRect(
            part.x * gridSize,
            part.y * gridSize,
            gridSize-1,
            gridSize-1
        );

    });

} function endGame(){

    clearInterval(gameLoop);

    document.getElementById("finalScore").textContent = score;

    document.getElementById("gameOver").style.display="block";


    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "snakeHighScore",
            highScore
        );

        document.getElementById("highScore").textContent = highScore;
    }

}



function restartGame(){

    startGame();

}



//
// Keyboard controls
//

document.addEventListener(
"keydown",
function(event){

    switch(event.key){

        case "ArrowUp":

            if(dy !== 1){
                dx = 0;
                dy = -1;
            }

        break;


        case "ArrowDown":

            if(dy !== -1){
                dx = 0;
                dy = 1;
            }

        break;


        case "ArrowLeft":

            if(dx !== 1){
                dx = -1;
                dy = 0;
            }

        break;


        case "ArrowRight":

            if(dx !== -1){
                dx = 1;
                dy = 0;
            }

        break;

    }

});



//
// Mobile swipe controls
//

let touchStartX = 0;
let touchStartY = 0;


canvas.addEventListener(
"touchstart",
function(event){

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;

},
false);



canvas.addEventListener(
"touchend",
function(event){

    let touchEndX = event.changedTouches[0].clientX;
    let touchEndY = event.changedTouches[0].clientY;


    let xDifference = touchEndX - touchStartX;
    let yDifference = touchEndY - touchStartY;



    // Horizontal swipe

    if(Math.abs(xDifference) > Math.abs(yDifference)){


        if(xDifference > 0 && dx !== -1){

            dx = 1;
            dy = 0;

        }
        else if(xDifference < 0 && dx !== 1){

            dx = -1;
            dy = 0;

        }

    }


    // Vertical swipe

    else{


        if(yDifference > 0 && dy !== -1){

            dx = 0;
            dy = 1;

        }
        else if(yDifference < 0 && dy !== 1){

            dx = 0;
            dy = -1;

        }

    }


},
false);



// Start game automatically

startGame();

</script>

</body>
</html>
