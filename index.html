<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Don’t thank me 😘</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#222;

    font-family:"Courier New",monospace;

}



#phone{

    background:#9bbc0f;

    border:12px solid #555;

    border-radius:20px;

    padding:20px;

    text-align:center;

    box-shadow:
    inset 0 0 20px #306230,
    0 10px 30px black;

}



h1{

    color:#071807;

    font-size:20px;

    margin-bottom:10px;

}



#score{

    color:#071807;

    margin-bottom:10px;

    font-size:16px;

}



canvas{

    background:#9bbc0f;

    border:4px solid #306230;

    image-rendering:pixelated;

}



h2{

    color:#071807;

    font-size:16px;

    margin-top:10px;

}



#leaderboard{

    color:#071807;

    text-align:left;

    width:220px;

    margin:10px auto;

    font-size:14px;

}



#leaderboard li{

    padding:2px;

}



#message{

    height:25px;

    margin-top:10px;

    color:#071807;

    font-size:18px;

}



#nameBox{

    display:none;

    color:#071807;

    margin-top:10px;

}



#playerName{

    width:180px;

    padding:5px;

    text-align:center;

    background:#9bbc0f;

    border:2px solid #306230;

    color:#071807;

    font-family:"Courier New";

    font-size:16px;

}



button{

    margin-top:10px;

    padding:8px 20px;

    background:#306230;

    color:#9bbc0f;

    border:none;

    cursor:pointer;

    font-family:inherit;

}


</style>

</head>


<body>


<div id="phone">


<h1>Don’t thank me 😘</h1>


<div id="score">

SCORE:
<span id="scoreValue">0</span>

&nbsp;&nbsp;

HI:
<span id="highScore">0</span>

</div>


<canvas id="game" width="400" height="400"></canvas>


<h2>TOP 10</h2>


<ol id="leaderboard"></ol>


<div id="message"></div>



<div id="nameBox">

<p>ENTER YOUR NAME</p>

<input id="playerName" maxlength="20" placeholder="Your name">

<br>

<button onclick="saveScore()">
SAVE
</button>

</div>



<button onclick="restartGame()">
START
</button>



</div>



<script>


const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");


const grid=20;

const tiles=canvas.width/grid;


let snake;

let food;

let dx;

let dy;

let score;

let speed;

let loop;


let highScore =
localStorage.getItem("nokiaHigh") || 0;


let topScores =
JSON.parse(localStorage.getItem("snakeTop10")) || [];



document.getElementById("highScore").textContent=highScore;



function updateLeaderboard(){

let list=document.getElementById("leaderboard");

list.innerHTML="";


topScores.forEach(entry=>{


let item=document.createElement("li");


item.textContent =
entry.name + " - " + entry.score;


list.appendChild(item);


});


}



function startGame(){


document.getElementById("message").textContent="";


snake=[

{x:10,y:10},

{x:9,y:10},

{x:8,y:10}

];


dx=1;

dy=0;


score=0;

speed=180;


document.getElementById("scoreValue").textContent=score;


food=createFood();


clearInterval(loop);


loop=setInterval(update,speed);


draw();


}



function createFood(){


let f;


do{


f={

x:Math.floor(Math.random()*tiles),

y:Math.floor(Math.random()*tiles)

};


}
while(
snake.some(
part=>part.x===f.x && part.y===f.y
)
);


return f;


}

function update(){


let head={

x:snake[0].x+dx,

y:snake[0].y+dy

};



// Nokia style screen wrapping

if(head.x<0)
head.x=tiles-1;


if(head.x>=tiles)
head.x=0;


if(head.y<0)
head.y=tiles-1;


if(head.y>=tiles)
head.y=0;




// Snake collision

if(
snake.some(
part=>part.x===head.x &&
part.y===head.y
)
){

gameOver();

return;

}



snake.unshift(head);



if(
head.x===food.x &&
head.y===food.y
){


score++;


document.getElementById("scoreValue").textContent=score;


food=createFood();



if(score>highScore){

highScore=score;

localStorage.setItem(
"nokiaHigh",
highScore
);

document.getElementById("highScore").textContent=highScore;

}



if(score%5===0 && speed>100){

speed-=10;

clearInterval(loop);

loop=setInterval(update,speed);

}


}
else{

snake.pop();

}



draw();


}





function draw(){


ctx.fillStyle="#9bbc0f";


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



// food

ctx.fillStyle="#071807";


ctx.fillRect(

food.x*grid+5,

food.y*grid+5,

grid-10,

grid-10

);



// snake

snake.forEach(part=>{


ctx.fillStyle="#071807";


ctx.fillRect(

part.x*grid,

part.y*grid,

grid-1,

grid-1

);


});


}





function gameOver(){


clearInterval(loop);



document.getElementById("nameBox").style.display="block";


document.getElementById("playerName").focus();



let count=0;


let blink=setInterval(()=>{


document.getElementById("message").textContent=

count%2===0
?"GAME OVER"
:"";


count++;


if(count>6){

clearInterval(blink);

}


},400);



}





function saveScore(){


let name =
document.getElementById("playerName")
.value
.trim();



if(name===""){

name="Anonymous";

}



topScores.push({

name:name,

score:score

});



topScores.sort(

(a,b)=>b.score-a.score

);



topScores =
topScores.slice(0,10);



localStorage.setItem(

"snakeTop10",

JSON.stringify(topScores)

);



updateLeaderboard();



document.getElementById("nameBox").style.display="none";


document.getElementById("playerName").value="";


}





function restartGame(){


document.getElementById("nameBox").style.display="none";


startGame();


}





// Keyboard controls

document.addEventListener(
"keydown",
event=>{


switch(event.key){


case "ArrowUp":

case "8":

if(dy!==1){

dx=0;

dy=-1;

}

break;



case "ArrowDown":

case "2":

if(dy!==-1){

dx=0;

dy=1;

}

break;



case "ArrowLeft":

case "4":

if(dx!==1){

dx=-1;

dy=0;

}

break;



case "ArrowRight":

case "6":

if(dx!==-1){

dx=1;

dy=0;

}

break;


}


});






// Touch controls

let startX=0;

let startY=0;



canvas.addEventListener(
"touchstart",
e=>{

startX=e.touches[0].clientX;

startY=e.touches[0].clientY;

});



canvas.addEventListener(
"touchend",
e=>{


let endX=e.changedTouches[0].clientX;

let endY=e.changedTouches[0].clientY;


let x=endX-startX;

let y=endY-startY;



if(Math.abs(x)>Math.abs(y)){


if(x>0 && dx!==-1){

dx=1;

dy=0;

}


if(x<0 && dx!==1){

dx=-1;

dy=0;

}


}
else{


if(y>0 && dy!==-1){

dx=0;

dy=1;

}


if(y<0 && dy!==1){

dx=0;

dy=-1;

}


}


});






// Nokia startup screen

function startup(){


ctx.fillStyle="#9bbc0f";


ctx.fillRect(
0,
0,
400,
400
);



ctx.fillStyle="#071807";


ctx.font="28px Courier New";


ctx.fillText(
"Don’t",
145,
160
);



ctx.fillText(
"thank me 😘",
85,
210
);



setTimeout(
startGame,
1500
);


}



updateLeaderboard();


startup();



</script>


</body>

</html>
