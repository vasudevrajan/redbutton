<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Don’t thank me 😘</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#111;

    font-family:"Courier New",monospace;

    overflow:hidden;

}


/* Nokia 3310 body */

.phone{

    width:380px;

    background:#bdbdbd;

    border-radius:35px;

    padding:25px;

    box-shadow:
    inset 0 0 25px #777,
    0 20px 50px #000;

    text-align:center;

}



.logo{

    font-size:24px;

    font-weight:bold;

    color:#222;

    margin-bottom:12px;

}




.screen{

    background:#9ca38a;

    border:10px solid #333;

    padding:12px;

    border-radius:8px;

    box-shadow:
    inset 0 0 20px #555;

}





canvas{

    width:336px;

    height:192px;

    background:#b8c090;

    image-rendering:pixelated;

    border:2px solid #222;

}





.info{

    color:#111;

    margin-top:8px;

    font-size:15px;

}




#message{

    height:20px;

    font-weight:bold;

    margin-top:5px;

}





#menuScreen{

    display:none;

    color:#111;

    text-align:left;

    height:120px;

}





#scores{

    font-size:14px;

    line-height:18px;

}




.keypad{

    margin-top:20px;

}



.row{

    display:flex;

    justify-content:center;

    gap:12px;

    margin:8px;

}





.key{

    width:60px;

    height:38px;

    background:#444;

    color:white;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

    box-shadow:

    inset 0 -4px 0 #222;

    user-select:none;

}



.key:active{

    transform:translateY(3px);

}





.softkeys{

    display:flex;

    justify-content:space-between;

    margin-top:15px;

}



.soft{

    width:90px;

    height:32px;

    background:#333;

    color:white;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:14px;

}



</style>

</head>


<body>


<div class="phone">


<div class="logo">
NOKIA
</div>



<div class="screen">


<canvas id="game" width="84" height="48"></canvas>


<div class="info">

SCORE:
<span id="score">0</span>

&nbsp;&nbsp;

HI:
<span id="high">0</span>

</div>


<div id="message"></div>


<div id="menuScreen">

<div id="scores"></div>

</div>


</div>



<div class="softkeys">

<div class="soft" onclick="openMenu()">
MENU
</div>


<div class="soft" onclick="closeMenu()">
BACK
</div>

</div>




<div class="keypad">


<div class="row">

<div class="key" onclick="move('up')">
▲
</div>

</div>



<div class="row">

<div class="key" onclick="move('left')">
◀
</div>

<div class="key" onclick="move('down')">
▼
</div>

<div class="key" onclick="move('right')">
▶
</div>

</div>


</div>


</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


const WIDTH = 84;
const HEIGHT = 48;


let snake = [];
let food = {};

let dx = 1;
let dy = 0;

let score = 0;

let highScore =
localStorage.getItem("nokiaHighScore") || 0;


let gameLoop;

let speed = 120;


let scores =
JSON.parse(localStorage.getItem("nokiaScores")) || [];



document.getElementById("high").textContent = highScore;




function startGame(){


    document.getElementById("menuScreen").style.display="none";

    document.getElementById("game").style.display="block";


    snake = [

        {x:42,y:24},
        {x:41,y:24},
        {x:40,y:24}

    ];


    dx = 1;
    dy = 0;


    score = 0;

    speed = 120;


    document.getElementById("score").textContent = score;

    document.getElementById("message").textContent="";


    createFood();


    clearInterval(gameLoop);


    gameLoop=setInterval(
        update,
        speed
    );


    draw();

}




function createFood(){


    do{


        food={

            x:Math.floor(Math.random()*WIDTH),

            y:Math.floor(Math.random()*HEIGHT)

        };


    }

    while(

        snake.some(

            part =>
            part.x===food.x &&
            part.y===food.y

        )

    );


}






function update(){


    let head={

        x:snake[0].x+dx,

        y:snake[0].y+dy

    };



    // Nokia screen wrapping

    if(head.x<0)
        head.x=WIDTH-1;


    if(head.x>=WIDTH)
        head.x=0;


    if(head.y<0)
        head.y=HEIGHT-1;


    if(head.y>=HEIGHT)
        head.y=0;





    if(

        snake.some(

            part =>
            part.x===head.x &&
            part.y===head.y

        )

    ){

        gameOver();

        return;

    }




    snake.unshift(head);





    if(

        head.x===food.x &&
        head.y===food.y

    ){


        score++;


        document.getElementById("score").textContent=score;


        createFood();



        if(score%10===0 && speed>60){


            speed-=10;


            clearInterval(gameLoop);


            gameLoop=setInterval(
                update,
                speed
            );


        }


    }

    else{


        snake.pop();

    }



    draw();


}






function draw(){


    // LCD background

    ctx.fillStyle="#b8c090";


    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );





    // food sprite

    ctx.fillStyle="#111";


    ctx.fillRect(

        food.x,

        food.y,

        2,

        2

    );






    // snake sprites


    snake.forEach((part,index)=>{


        ctx.fillStyle="#111";



        if(index===0){


            // head

            ctx.fillRect(

                part.x,

                part.y,

                3,

                3

            );


        }

        else{


            // body pixels

            ctx.fillRect(

                part.x,

                part.y,

                2,

                2

            );


        }



    });



}







function gameOver(){


    clearInterval(gameLoop);


    document.getElementById("message").textContent=
    "GAME OVER";



    if(score>highScore){


        highScore=score;


        localStorage.setItem(

            "nokiaHighScore",

            highScore

        );


        document.getElementById("high").textContent=
        highScore;


    }



    setTimeout(
        saveScore,
        500
    );


}






function saveScore(){


    let name =
    prompt("ENTER NAME");



    if(!name){

        name="Anonymous";

    }



    scores.push({

        name:name,

        score:score

    });



    scores.sort(

        (a,b)=>
        b.score-a.score

    );



    scores=scores.slice(0,10);



    localStorage.setItem(

        "nokiaScores",

        JSON.stringify(scores)

    );



}






function move(direction){


    switch(direction){


        case "up":

            if(dy!==1){

                dx=0;
                dy=-1;

            }

        break;



        case "down":

            if(dy!==-1){

                dx=0;
                dy=1;

            }

        break;



        case "left":

            if(dx!==1){

                dx=-1;
                dy=0;

            }

        break;



        case "right":

            if(dx!==-1){

                dx=1;
                dy=0;

            }

        break;


    }


}

// =========================
// CONTROLS + MENU + START
// =========================


// Keyboard controls

document.addEventListener(
"keydown",
event=>{


switch(event.key){


case "ArrowUp":
case "8":

move("up");

break;


case "ArrowDown":
case "2":

move("down");

break;


case "ArrowLeft":
case "4":

move("left");

break;


case "ArrowRight":
case "6":

move("right");

break;


case "Enter":

openMenu();

break;


}


});







// Touch controls


let touchStartX=0;
let touchStartY=0;



canvas.addEventListener(
"touchstart",
event=>{


touchStartX=
event.touches[0].clientX;


touchStartY=
event.touches[0].clientY;


},
false
);




canvas.addEventListener(
"touchend",
event=>{


let endX=
event.changedTouches[0].clientX;


let endY=
event.changedTouches[0].clientY;



let x=endX-touchStartX;

let y=endY-touchStartY;



if(Math.abs(x)>Math.abs(y)){


if(x>0)
move("right");

else
move("left");


}

else{


if(y>0)
move("down");

else
move("up");


}



},
false
);






// Nokia menu


function openMenu(){


clearInterval(gameLoop);


document.getElementById("game").style.display="none";


document.getElementById("menuScreen").style.display="block";



let html="";


html+="SNAKE II<br><br>";

html+="TOP 10<br>";

html+="------------<br>";



if(scores.length===0){

html+="NO SCORES";

}

else{


scores.forEach(

(entry,index)=>{


html+=

(index+1)+
". "+
entry.name+
" "+
entry.score+
"<br>";


}


);


}



document.getElementById("scores").innerHTML=html;


}






function closeMenu(){


document.getElementById("menuScreen").style.display="none";


document.getElementById("game").style.display="block";


startGame();


}







// Startup screen


function startup(){


ctx.fillStyle="#b8c090";


ctx.fillRect(

0,

0,

WIDTH,

HEIGHT

);



ctx.fillStyle="#111";


ctx.font="8px Courier New";


ctx.fillText(

"NOKIA",

32,

18

);



ctx.fillText(

"Snake",

34,

28

);



setTimeout(

startGame,

1500

);


}







// Boot phone


startup();



</script>


</body>

</html>
