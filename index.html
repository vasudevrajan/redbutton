<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nokia 3310 Snake II V5</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}


body{

    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#1b1b1b;

    font-family:Arial,sans-serif;

}



.phone{

    width:360px;

    background:#b8b8ad;

    border-radius:38px;

    padding:25px;

    box-shadow:

    inset -10px -10px 18px #777,
    inset 10px 10px 18px #eee,
    0 25px 50px #000;

}



.status{

    display:flex;

    justify-content:space-between;

    color:#222;

    font-size:12px;

    margin-bottom:5px;

}



.screen-frame{

    background:#444;

    padding:14px;

    border-radius:12px;

}



canvas{

    width:100%;

    display:block;

    background:#9bbc0f;

    border:4px solid #222;

    image-rendering:pixelated;

}



.logo{

    text-align:center;

    font-size:30px;

    font-weight:bold;

    color:#333;

    margin:15px;

}



.keypad{

    text-align:center;

}



button{

    width:52px;

    height:42px;

    margin:3px;

    border:0;

    border-radius:10px;

    background:#ddd;

    font-weight:bold;

    box-shadow:0 3px 0 #777;

}



button:active{

    transform:translateY(3px);

}



.circle{

    border-radius:50%;

    width:55px;

    height:55px;

}



.softkeys{

    display:flex;

    justify-content:space-between;

    margin-top:10px;

}



.softkeys button{

    width:90px;

}



</style>

</head>


<body>


<div class="phone">



<div class="status">

<span id="signal">
▮▮▮
</span>


<span id="clock">
12:00
</span>


<span id="battery">
▮▮▮
</span>

</div>




<div class="screen-frame">


<canvas id="lcd"
width="84"
height="48">
</canvas>


</div>





<div class="logo">
NOKIA
</div>





<div class="keypad">


<div>


<button class="circle"
onclick="press('UP')">
▲
</button>


</div>



<div>


<button class="circle"
onclick="press('LEFT')">
◀
</button>


<button class="circle"
onclick="press('OK')">
5
</button>


<button class="circle"
onclick="press('RIGHT')">
▶
</button>


</div>




<div>


<button class="circle"
onclick="press('DOWN')">
▼
</button>


</div>




<div>


<button onclick="press('UP')">
2
</button>


<button onclick="press('LEFT')">
4
</button>


<button onclick="press('OK')">
5
</button>


<button onclick="press('RIGHT')">
6
</button>


<button onclick="press('DOWN')">
8
</button>


</div>


</div>





<div class="softkeys">


<button onclick="press('MENU')">
MENU
</button>


<button onclick="press('BACK')">
BACK
</button>


</div>



</div>





<script>


////////////////////////////////////////////////////
// VERSION 5 - PART 1
// LCD SYSTEM + NOKIA FOUNDATION
////////////////////////////////////////////////////



const canvas =
document.getElementById("lcd");


const ctx =
canvas.getContext("2d");



ctx.imageSmoothingEnabled=false;



const LCD_WIDTH=84;

const LCD_HEIGHT=48;



const PIXEL=1;



function lcdClear(){

    ctx.fillStyle="#9bbc0f";

    ctx.fillRect(
        0,
        0,
        LCD_WIDTH,
        LCD_HEIGHT
    );

}




function lcdText(
text,
x,
y,
size=6
){

    ctx.fillStyle="#0f380f";

    ctx.font=
    size+"px monospace";

    ctx.fillText(
        text,
        x,
        y
    );

}





function lcdPixel(
x,
y
){

    ctx.fillStyle="#0f380f";

    ctx.fillRect(
        x,
        y,
        1,
        1
    );

}





function updateClock(){

    let now=new Date();


    document.getElementById(
        "clock"
    ).innerHTML=

    now
    .getHours()
    .toString()
    .padStart(2,"0")
    +
    ":"
    +
    now
    .getMinutes()
    .toString()
    .padStart(2,"0");

}



setInterval(
updateClock,
1000
);


updateClock();






function nokiaBoot(){


    lcdClear();


    lcdText(
        "NOKIA",
        28,
        22,
        8
    );



    setTimeout(()=>{


        lcdClear();


        lcdText(
            "SNAKE II",
            22,
            25,
            6
        );


    },1200);



    setTimeout(()=>{


        showMenu();


    },2500);



}






let gameState="BOOT";





function press(key){

    console.log(
        key
    );

}






function showMenu(){

    gameState="MENU";


    lcdClear();


    lcdText(
        "SNAKE II",
        22,
        18,
        6
    );


    lcdText(
        "5 START",
        22,
        30,
        6
    );


    lcdText(
        "MENU LVL",
        10,
        42,
        5
    );


}






nokiaBoot();

////////////////////////////////////////////////////
// VERSION 5 - PART 2
// SNAKE II ENGINE
////////////////////////////////////////////////////


const GRID_SIZE=2;


// 84x48 LCD with 2x2 pixels per game block

const GAME_WIDTH =
Math.floor(LCD_WIDTH / GRID_SIZE);


const GAME_HEIGHT =
Math.floor(LCD_HEIGHT / GRID_SIZE);



let snake=[];

let food={};


let direction="RIGHT";

let nextDirection="RIGHT";


let score=0;


let highScore =
Number(
localStorage.getItem("snakeV5High")
)||0;



let level =
Number(
localStorage.getItem("snakeV5Level")
)||1;



let running=false;


let gameTimer=null;



let maze=[];



const mazeLayouts=[


[
{x:15,y:8},
{x:15,y:9},
{x:15,y:10},

{x:26,y:8},
{x:26,y:9},
{x:26,y:10}
],



[
{x:10,y:12},
{x:11,y:12},
{x:12,y:12},

{x:30,y:5},
{x:31,y:5},
{x:32,y:5}
],



[
{x:20,y:4},
{x:20,y:5},
{x:20,y:6},
{x:20,y:7},

{x:20,y:15},
{x:20,y:16}
]

];








function startGame(){


    snake=[

        {
            x:20,
            y:12
        },

        {
            x:19,
            y:12
        },

        {
            x:18,
            y:12
        }

    ];



    direction="RIGHT";

    nextDirection="RIGHT";



    score=0;



    maze =
    JSON.parse(

        JSON.stringify(

            mazeLayouts[
            Math.floor(
            Math.random()
            *
            mazeLayouts.length
            )
            ]

        )

    );



    spawnFood();



    running=true;

    gameState="PLAY";



    clearInterval(gameTimer);



    gameTimer=setInterval(

        updateGame,

        getSpeed()

    );



    drawGame();


}








function getSpeed(){


    return 250-(level*15);


}









function spawnFood(){


    do{


        food={

            x:
            Math.floor(
            Math.random()
            *
            GAME_WIDTH
            ),


            y:
            Math.floor(
            Math.random()
            *
            GAME_HEIGHT
            )

        };



    }


    while(

        snake.some(

            part=>

            part.x===food.x &&

            part.y===food.y

        )

        ||

        maze.some(

            wall=>

            wall.x===food.x &&

            wall.y===food.y

        )

    );

}









function updateGame(){


    direction=nextDirection;



    let head={

        x:snake[0].x,

        y:snake[0].y

    };





    if(direction==="UP")
        head.y--;



    if(direction==="DOWN")
        head.y++;



    if(direction==="LEFT")
        head.x--;



    if(direction==="RIGHT")
        head.x++;






    // Snake II wrap mode


    if(head.x<0)
        head.x=GAME_WIDTH-1;



    if(head.x>=GAME_WIDTH)
        head.x=0;



    if(head.y<0)
        head.y=GAME_HEIGHT-1;



    if(head.y>=GAME_HEIGHT)
        head.y=0;







    if(

        maze.some(

            wall=>

            wall.x===head.x &&

            wall.y===head.y

        )

    ){

        gameOver();

        return;

    }






    if(

        snake.some(

            part=>

            part.x===head.x &&

            part.y===head.y

        )

    ){

        gameOver();

        return;

    }







    snake.unshift(head);






    if(

        head.x===food.x &&

        head.y===food.y

    ){


        score++;



        if(score>highScore){


            highScore=score;


            localStorage.setItem(

                "snakeV5High",

                highScore

            );


        }



        spawnFood();



    }

    else{


        snake.pop();


    }





    drawGame();



}









function drawGame(){


    lcdClear();



    ctx.fillStyle="#0f380f";






    // maze


    maze.forEach(

        wall=>{


            ctx.fillRect(

                wall.x*GRID_SIZE,

                wall.y*GRID_SIZE,

                GRID_SIZE,

                GRID_SIZE

            );


        }

    );







    // food


    ctx.fillRect(

        food.x*GRID_SIZE,

        food.y*GRID_SIZE,

        GRID_SIZE,

        GRID_SIZE

    );








    // snake


    snake.forEach(

        part=>{


            ctx.fillRect(

                part.x*GRID_SIZE,

                part.y*GRID_SIZE,

                GRID_SIZE,

                GRID_SIZE

            );


        }

    );







    lcdText(

        "S"+score,

        2,

        6,

        5

    );



    lcdText(

        "H"+highScore,

        55,

        6,

        5

    );



}









function gameOver(){


    clearInterval(gameTimer);



    running=false;



    gameState="GAMEOVER";



    lcdClear();



    lcdText(

        "GAME OVER",

        15,

        22,

        7

    );



    lcdText(

        "5 RETRY",

        22,

        35,

        6

    );


}









// Replace the basic button handler


function press(key){



    if(key==="OK"){


        if(!running){

            startGame();

        }


        return;

    }






    if(key==="MENU"){


        level++;



        if(level>9)

            level=1;



        localStorage.setItem(

            "snakeV5Level",

            level

        );



        showMenu();



        return;


    }







    if(key==="BACK"){


        clearInterval(gameTimer);


        running=false;


        showMenu();


        return;


    }








    if(!running)

        return;








    if(

        key==="UP"

        &&

        direction!=="DOWN"

    )

        nextDirection="UP";







    if(

        key==="DOWN"

        &&

        direction!=="UP"

    )

        nextDirection="DOWN";








    if(

        key==="LEFT"

        &&

        direction!=="RIGHT"

    )

        nextDirection="LEFT";








    if(

        key==="RIGHT"

        &&

        direction!=="LEFT"

    )

        nextDirection="RIGHT";



}








document.addEventListener(

"keydown",

function(e){



    if(e.key==="ArrowUp")
        press("UP");



    if(e.key==="ArrowDown")
        press("DOWN");



    if(e.key==="ArrowLeft")
        press("LEFT");



    if(e.key==="ArrowRight")
        press("RIGHT");



    if(e.key==="5" || e.key==="Enter")
        press("OK");



    if(e.key==="2")
        press("UP");



    if(e.key==="4")
        press("LEFT");



    if(e.key==="6")
        press("RIGHT");



    if(e.key==="8")
        press("DOWN");


});

////////////////////////////////////////////////////
// VERSION 5 - PART 3
// NOKIA EFFECTS + BONUS FEATURES
////////////////////////////////////////////////////


let audioContext=null;


let bonusItem=null;


let bonusTimer=null;



function initAudio(){


    if(!audioContext){


        audioContext =
        new (
        window.AudioContext ||
        window.webkitAudioContext
        )();


    }


}





function tone(
frequency=600,
duration=80
){


    initAudio();



    let osc =
    audioContext.createOscillator();


    let gain =
    audioContext.createGain();



    osc.type="square";


    osc.frequency.value =
    frequency;



    osc.connect(gain);


    gain.connect(
        audioContext.destination
    );



    osc.start();



    gain.gain.setValueAtTime(

        0.12,

        audioContext.currentTime

    );



    gain.gain.exponentialRampToValueAtTime(

        0.01,

        audioContext.currentTime+
        duration/1000

    );



    osc.stop(

        audioContext.currentTime+
        duration/1000

    );


}







function vibratePhone(){


    if(navigator.vibrate){


        navigator.vibrate(60);


    }


}








function createBonus(){


    if(bonusItem)

        return;



    do{


        bonusItem={


            x:
            Math.floor(
            Math.random()*GAME_WIDTH
            ),


            y:
            Math.floor(
            Math.random()*GAME_HEIGHT
            ),


            value:25


        };


    }

    while(

        snake.some(

            part=>

            part.x===bonusItem.x &&

            part.y===bonusItem.y

        )

    );



    clearTimeout(
        bonusTimer
    );


    bonusTimer=setTimeout(()=>{


        bonusItem=null;


    },6000);


}








function drawBonus(){


    if(!bonusItem)

        return;



    ctx.fillStyle="#0f380f";



    if(

    Math.floor(
    Date.now()/300
    )%2

    ){



        ctx.fillRect(

            bonusItem.x*GRID_SIZE,

            bonusItem.y*GRID_SIZE,

            GRID_SIZE,

            GRID_SIZE

        );


    }


}








function checkBonus(){


    if(!bonusItem)

        return;




    if(


        snake[0].x===bonusItem.x &&

        snake[0].y===bonusItem.y


    ){


        score += bonusItem.value;


        bonusItem=null;



        tone(
            900,
            120
        );


        vibratePhone();


    }


}









// Add bonus drawing

const originalDraw =
drawGame;



drawGame=function(){


    originalDraw();


    drawBonus();


};








// Add bonus checking

const originalUpdate =
updateGame;



updateGame=function(){


    let oldScore=score;



    originalUpdate();



    checkBonus();



    if(score>oldScore){


        tone(
            650,
            70
        );


        vibratePhone();



        canvas.style.opacity="0.65";


        setTimeout(()=>{


            canvas.style.opacity="1";


        },50);



    }



};








// Bonus appears after eating every 5 items

const originalSpawn =
spawnFood;



spawnFood=function(){


    originalSpawn();



    if(

        score>0 &&

        score%5===0

    ){


        createBonus();


    }


};








////////////////////////////////////////////////////
// BATTERY + SIGNAL
////////////////////////////////////////////////////


let batteryLevel=3;

let signalLevel=3;



function updatePhoneStatus(){



    batteryLevel--;


    signalLevel--;



    if(batteryLevel<=0)

        batteryLevel=3;



    if(signalLevel<=0)

        signalLevel=3;





    document.getElementById(
        "battery"
    ).innerHTML =

    "▮".repeat(
        batteryLevel
    );





    document.getElementById(
        "signal"
    ).innerHTML =

    "▮".repeat(
        signalLevel
    );



}



setInterval(

    updatePhoneStatus,

    15000

);









////////////////////////////////////////////////////
// TOUCH SWIPE CONTROLS
////////////////////////////////////////////////////


let swipeX=0;

let swipeY=0;



canvas.addEventListener(

"touchstart",

function(e){


    swipeX =
    e.changedTouches[0].screenX;


    swipeY =
    e.changedTouches[0].screenY;



},
{
    passive:true
}

);






canvas.addEventListener(

"touchend",

function(e){



    let endX =
    e.changedTouches[0].screenX;


    let endY =
    e.changedTouches[0].screenY;



    let dx=endX-swipeX;

    let dy=endY-swipeY;





    if(

        Math.abs(dx) >

        Math.abs(dy)

    ){



        if(dx>0)

            press("RIGHT");

        else

            press("LEFT");



    }

    else{



        if(dy>0)

            press("DOWN");

        else

            press("UP");



    }



}

);






canvas.addEventListener(

"touchmove",

function(e){

    e.preventDefault();

},

{
    passive:false
}

);

////////////////////////////////////////////////////
// VERSION 5 - PART 4
// FINAL NOKIA POLISH
////////////////////////////////////////////////////



let paused=false;



////////////////////////////////////////////////////
// PAUSE FUNCTION
////////////////////////////////////////////////////


function togglePause(){


    if(!running)

        return;



    paused=!paused;



    if(paused){


        clearInterval(gameTimer);



        lcdText(

            "PAUSED",

            25,

            25,

            7

        );



    }

    else{


        gameTimer=setInterval(

            updateGame,

            getSpeed()

        );


        drawGame();


    }


}








////////////////////////////////////////////////////
// EXTEND KEYBOARD CONTROLS
////////////////////////////////////////////////////


document.addEventListener(

"keydown",

function(e){



    if(e.key==="p" || e.key==="P"){


        togglePause();


    }



}

);








////////////////////////////////////////////////////
// FINAL NOKIA MENU
////////////////////////////////////////////////////


function showMenu(){


    gameState="MENU";



    lcdClear();



    lcdText(

        "SNAKE II",

        22,

        16,

        7

    );



    lcdText(

        "5 PLAY",

        25,

        28,

        6

    );



    lcdText(

        "LV "+level,

        25,

        40,

        6

    );


}








////////////////////////////////////////////////////
// FINAL BOOT ANIMATION
////////////////////////////////////////////////////


function finalBoot(){



    gameState="BOOT";



    lcdClear();



    lcdText(

        "NOKIA",

        28,

        20,

        8

    );



    setTimeout(()=>{


        lcdClear();



        lcdText(

            "SNAKE II",

            22,

            25,

            6

        );


    },1200);





    setTimeout(()=>{


        showMenu();



    },2500);



}








////////////////////////////////////////////////////
// START FINAL SYSTEM
////////////////////////////////////////////////////


finalBoot();





////////////////////////////////////////////////////
// CLOSE SCRIPT BELOW THIS LINE
////////////////////////////////////////////////////

</script>

</body>

</html>
